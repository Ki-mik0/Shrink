[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "shrink"
dynamic = ["version"]
description = "Stateless Unix filter that compresses code and text for LLM context: stdin in, stdout out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Viktoriia Andrusyk" }]
keywords = ["llm", "tokens", "cli", "compression", "context"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Filters",
]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
all = ["shrink[tokens]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
shrink = "shrink.cli:main"

[tool.hatch.version]
path = "src/shrink/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shrink"]

# ---------------------------------------------------------------- quality

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR2004", # magic numbers are fine in tests and level checks
    "PLR0913", # Pipeline takes its collaborators explicitly (DI)
    "PLC0415", # lazy imports are deliberate: optional features must not slow start-up
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["shrink"]

[[tool.mypy.overrides]]
module = ["tiktoken", "tiktoken.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=shrink --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["shrink"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
